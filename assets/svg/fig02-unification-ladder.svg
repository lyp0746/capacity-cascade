<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
<rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="26" class="t">统一的四级阶梯与本书的位置</text>
<rect x="60" y="60" width="600" height="42" rx="6" fill="#f7f7f5" stroke="#666" stroke-width="1.4"/>
<text x="80" y="87" class="l" text-anchor="start" fill="#666" font-weight="700">U4 同一</text>
<text x="180" y="87" class="l" text-anchor="start" fill="#1a1a1a" font-weight="normal">本体上的同一</text>
<text x="640" y="87" class="l" text-anchor="end" fill="#666" font-weight="normal">难检验</text>
<rect x="60" y="118" width="600" height="42" rx="6" fill="#f7f7f5" stroke="#666" stroke-width="1.4"/>
<text x="80" y="145" class="l" text-anchor="start" fill="#666" font-weight="700">U3 可模拟</text>
<text x="180" y="145" class="l" text-anchor="start" fill="#1a1a1a" font-weight="normal">一方可在另一方机制上实现</text>
<text x="640" y="145" class="l" text-anchor="end" fill="#666" font-weight="normal">难检验</text>
<rect x="60" y="176" width="600" height="42" rx="6" fill="#f7f7f5" stroke="#666" stroke-width="1.4"/>
<text x="80" y="203" class="l" text-anchor="start" fill="#666" font-weight="700">U2 同律</text>
<text x="180" y="203" class="l" text-anchor="start" fill="#1a1a1a" font-weight="normal">粗化后遵循同一组方程</text>
<text x="640" y="203" class="l" text-anchor="end" fill="#666" font-weight="normal">难检验</text>
<rect x="60" y="234" width="600" height="42" rx="6" fill="#f7f7f5" stroke="#009E73" stroke-width="1.4"/>
<text x="80" y="261" class="l" text-anchor="start" fill="#009E73" font-weight="700">U1 同约束</text>
<text x="180" y="261" class="l" text-anchor="start" fill="#1a1a1a" font-weight="normal">受同一组约束</text>
<text x="640" y="261" class="l" text-anchor="end" fill="#666" font-weight="normal">易检验</text>
<line x1="60" y1="224" x2="660" y2="224" stroke="#009E73" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="360" y="305" class="l" text-anchor="middle" fill="#009E73" font-weight="700">本书承诺线：只主张 U1</text>
</svg>
