<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="26" class="t">容量级联（三时间尺度）</text>
<rect x="60" y="90" width="520" height="52" rx="6" fill="#fafafa" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="80" y="113" class="l" text-anchor="start" fill="#3a6ea5" font-weight="700">快 · 选择层（毫秒—秒）</text>
<text x="80" y="132" class="l" text-anchor="start" fill="#666" font-weight="normal">工作记忆 / 注意力：约 4–7 项</text>
<line x1="560" y1="96" x2="560" y2="136" stroke="#3a6ea5" stroke-width="3" stroke-dasharray="3,3"/>
<rect x="60" y="170" width="520" height="52" rx="6" fill="#fafafa" stroke="#b8862f" stroke-width="1.6"/>
<text x="80" y="193" class="l" text-anchor="start" fill="#b8862f" font-weight="700">中 · 暂存层（秒—小时）</text>
<text x="80" y="212" class="l" text-anchor="start" fill="#666" font-weight="normal">上下文窗口 / KV 缓存：易受干扰</text>
<line x1="560" y1="176" x2="560" y2="216" stroke="#b8862f" stroke-width="3" stroke-dasharray="3,3"/>
<rect x="60" y="250" width="520" height="52" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.6"/>
<text x="80" y="273" class="l" text-anchor="start" fill="#009E73" font-weight="700">慢 · 结构层（小时—终身）</text>
<text x="80" y="292" class="l" text-anchor="start" fill="#666" font-weight="normal">长期记忆 / 权重：缓慢固化</text>
<line x1="560" y1="256" x2="560" y2="296" stroke="#009E73" stroke-width="3" stroke-dasharray="3,3"/>
<line x1="320" y1="142" x2="320" y2="170" stroke="#666" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="320" y1="222" x2="320" y2="250" stroke="#666" stroke-width="1.4" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0" fill="none" stroke="#666"/></marker></defs>
<text x="330" y="168" class="l" text-anchor="start" fill="#666" font-weight="normal">丢弃是层间唯一传送带</text>
<text x="320" y="335" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="700">总吞吐不随层数线性增加</text>
</svg>
