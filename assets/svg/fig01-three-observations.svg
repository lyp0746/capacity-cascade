<text x="32" y="125.0" class="l" text-anchor="middle" transform="rotate(-90 32 125.0)">正确率</text>
<polyline points="40.0,80.0 70.0,120.0 100.0,160.0 130.0,175.0 160.0,160.0 190.0,120.0 220.0,80.0" fill="none" stroke="#3a6ea5" stroke-width="2.4"/>
<text x="280" y="26" class="t">（b）上下文漂移</text>
<line x1="300" y1="200" x2="480" y2="200" class="ax"/>
<line x1="300" y1="200" x2="300" y2="50" class="ax"/>
