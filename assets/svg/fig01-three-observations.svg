<text x="292" y="125.0" class="l" text-anchor="middle" transform="rotate(-90 292 125.0)">与初始目标距离</text>
<polyline points="300.0,190.0 350.0,185.0 400.0,175.0 450.0,158.0 480.0,145.0" fill="none" stroke="#c94f4f" stroke-width="2.4"/>
<polyline points="300.0,190.0 350.0,183.0 400.0,172.0 450.0,158.0 480.0,140.0" fill="none" stroke="#3a6ea5" stroke-width="1.6" stroke-dasharray="5,4"/>
<text x="390" y="210" class="l" text-anchor="middle" fill="#c94f4f" font-weight="normal">偏置（线性）</text>
<text x="390" y="226" class="l" text-anchor="middle" fill="#3a6ea5" font-weight="normal">随机（√n）</text>
<text x="540" y="26" class="t">（c）自我改写</text>
<ellipse cx="620" cy="140" rx="70" ry="43.4" fill="none" stroke="#b8862f" stroke-width="2" />
<ellipse cx="620" cy="140" rx="52" ry="32.2" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
<ellipse cx="620" cy="140" rx="34" ry="21.1" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
