<text x="355" y="176" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">如何行动</text>
<rect x="480" y="110" width="170" height="90" rx="8" fill="#fafafa" stroke="#009E73" stroke-width="1.8"/>
<text x="565" y="148" class="l" text-anchor="middle" fill="#009E73" font-weight="700">强化学习</text>
