<line x1="440" y1="155" x2="480" y2="155" stroke="#666" stroke-width="1.6" marker-end="url(#h1)"/>
<defs><marker id="h1" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,0 L4,6 L8,0" fill="none" stroke="#666"/></marker></defs>
<text x="250" y="145" class="l" text-anchor="middle" fill="#666" font-weight="normal">定义相关性</text>
<text x="460" y="145" class="l" text-anchor="middle" fill="#666" font-weight="normal">约束目标</text>
<text x="350" y="260" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="700">三者交汇于母题，但各守其问题域：不是竞争关系，而是分工关系</text>
