<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340">
<rect x="0" y="0" width="700" height="340" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="26" class="t">信息瓶颈、自由能原理与强化学习的分工</text>
<rect x="60" y="110" width="170" height="90" rx="8" fill="#fafafa" stroke="#3a6ea5" stroke-width="1.8"/>
