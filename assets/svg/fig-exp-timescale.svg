<text x="150.0" y="130.0" text-anchor="start" font-size="11" fill="#2f6db0" font-weight="normal">单速率（最优网格）</text>
<line x1="120" y1="144" x2="144" y2="144" stroke="#ef6c00" stroke-width="2.4"/>
<text x="150.0" y="148.0" text-anchor="start" font-size="11" fill="#ef6c00" font-weight="normal">快+慢双速率</text>
<text x="440.0" y="466.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">T=200 时双速率好 3.8%，T=500 时好 3.6%；T≥1000 后两者无差别。</text>
<text x="440.0" y="486.0" text-anchor="middle" font-size="12" fill="#666666" font-weight="normal">这个窄窗口，是对“多时间尺度是矛盾的数学解”的一次限定：它只在切换快于学习率时成立。</text>
</svg>