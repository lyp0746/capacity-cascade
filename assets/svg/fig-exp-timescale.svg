<text x="653.1" y="410.0" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">5000</text>
<line x1="770.0" y1="390" x2="770.0" y2="395" stroke="#333"/>
<text x="770.0" y="410.0" text-anchor="middle" font-size="11" fill="#666666" font-weight="normal">10000</text>
