<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
<rect x="0" y="0" width="700" height="320" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="26" class="t">两种计算模式</text>
<rect x="40" y="60" width="280" height="200" rx="8" fill="#f4f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="180" y="90" class="l" text-anchor="middle" fill="#3a6ea5" font-weight="700">清醒计算</text>
<rect x="80" y="130" width="200" height="28" rx="4" fill="#ffffff" stroke="#3a6ea5"/>
<text x="180" y="149" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">外部输入</text>
<line x1="180" y1="158" x2="180" y2="170" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="80" y="170" width="200" height="28" rx="4" fill="#ffffff" stroke="#3a6ea5"/>
<text x="180" y="189" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">注意力选择</text>
<line x1="180" y1="198" x2="180" y2="210" stroke="#3a6ea5" stroke-width="1.4"/>
<rect x="80" y="210" width="200" height="28" rx="4" fill="#ffffff" stroke="#3a6ea5"/>
<text x="180" y="229" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">局部拟合（梯度下降）</text>
<text x="180" y="290" class="l" text-anchor="middle" fill="#666" font-weight="normal">适应 · 风险：过拟合、僵化</text>
<rect x="380" y="60" width="280" height="200" rx="8" fill="#f3f9f5" stroke="#009E73" stroke-width="1.6"/>
<text x="520" y="90" class="l" text-anchor="middle" fill="#009E73" font-weight="700">睡眠计算</text>
<rect x="420" y="130" width="200" height="28" rx="4" fill="#ffffff" stroke="#009E73"/>
<text x="520" y="149" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">外部输入切断</text>
<line x1="520" y1="158" x2="520" y2="170" stroke="#009E73" stroke-width="1.4"/>
<rect x="420" y="170" width="200" height="28" rx="4" fill="#ffffff" stroke="#009E73"/>
<text x="520" y="189" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">内源激活</text>
<line x1="520" y1="198" x2="520" y2="210" stroke="#009E73" stroke-width="1.4"/>
<rect x="420" y="210" width="200" height="28" rx="4" fill="#ffffff" stroke="#009E73"/>
<text x="520" y="229" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">全局重排（高熵采样）</text>
<text x="520" y="290" class="l" text-anchor="middle" fill="#666" font-weight="normal">泛化 · 风险：脱离现实</text>
<line x1="330" y1="160" x2="370" y2="160" stroke="#b8862f" stroke-width="2.4"/>
<text x="350" y="150" class="l" text-anchor="middle" fill="#b8862f" font-weight="700">协调</text>
</svg>
