<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
<rect x="0" y="0" width="640" height="330" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="26" class="t">系统巩固的互补学习系统（示意）</text>
<rect x="60" y="70" width="220" height="150" rx="8" fill="#f4f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="170" y="100" class="l" text-anchor="middle" fill="#3a6ea5" font-weight="700">海马体</text>
<text x="170" y="125" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">快 · 一次编码</text>
<text x="170" y="148" class="l" text-anchor="middle" fill="#666" font-weight="normal">高情境特异性</text>
<text x="170" y="171" class="l" text-anchor="middle" fill="#666" font-weight="normal">容量有限、脆弱</text>
<rect x="380" y="70" width="220" height="150" rx="8" fill="#f3f9f5" stroke="#009E73" stroke-width="1.6"/>
<text x="490" y="100" class="l" text-anchor="middle" fill="#009E73" font-weight="700">皮质</text>
<text x="490" y="125" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">慢 · 缓慢固化</text>
<text x="490" y="148" class="l" text-anchor="middle" fill="#666" font-weight="normal">低情境特异性</text>
<text x="490" y="171" class="l" text-anchor="middle" fill="#666" font-weight="normal">容量大、稳定</text>
<line x1="280" y1="145" x2="380" y2="145" stroke="#b8862f" stroke-width="2.4" marker-end="url(#m)"/>
<defs><marker id="m" markerWidth="9" markerHeight="9" refX="5" refY="6" orient="auto"><path d="M0,0 L5,6 L10,0" fill="none" stroke="#b8862f"/></marker></defs>
<text x="330" y="135" class="l" text-anchor="middle" fill="#b8862f" font-weight="700">睡眠重放</text>
<text x="330" y="265" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="700">快系统 + 慢系统 = 同时得到“快”与“稳”</text>
<text x="330" y="290" class="l" text-anchor="middle" fill="#666" font-weight="normal">这是容量级联在生物上的实例</text>
</svg>
