<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360">
<rect x="0" y="0" width="780" height="360" fill="#ffffff"/>
<style>text{font-family:'Microsoft YaHei','SimHei',Arial,sans-serif;fill:#1a1a1a;}.s{font-family:'Times New Roman',SimSun,serif;}.t{font-size:15px;font-weight:700;}.l{font-size:11px;}.ax{stroke:#666;stroke-width:1;}.g{stroke:#cfcfcf;stroke-width:1;}</style>
<text x="20" y="26" class="t">设计决策树：从现象到干预</text>
<rect x="300" y="50" width="180" height="44" rx="8" fill="#f4f8fb" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="390" y="77" class="l" text-anchor="middle" fill="#3a6ea5" font-weight="700">观察到的现象</text>
<line x1="390" y1="94" x2="110" y2="150" stroke="#cfcfcf"/>
<rect x="30" y="150" width="160" height="40" rx="6" fill="#ffffff" stroke="#666"/>
<text x="110" y="175" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">缓慢偏离目标</text>
<line x1="110" y1="190" x2="110" y2="220" stroke="#009E73" stroke-width="1.6"/>
<rect x="30" y="220" width="160" height="40" rx="6" fill="#fafafa" stroke="#009E73" stroke-width="1.6"/>
<text x="110" y="245" class="l" text-anchor="middle" fill="#009E73" font-weight="700">偏置型漂移</text>
<line x1="110" y1="260" x2="110" y2="285" stroke="#009E73" stroke-width="1.6"/>
<text x="110" y="305" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">D3 显著性重放</text>
<line x1="390" y1="94" x2="300" y2="150" stroke="#cfcfcf"/>
<rect x="220" y="150" width="160" height="40" rx="6" fill="#ffffff" stroke="#666"/>
<text x="300" y="175" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">信息找不到</text>
<line x1="300" y1="190" x2="300" y2="220" stroke="#b8862f" stroke-width="1.6"/>
<rect x="220" y="220" width="160" height="40" rx="6" fill="#fafafa" stroke="#b8862f" stroke-width="1.6"/>
<text x="300" y="245" class="l" text-anchor="middle" fill="#b8862f" font-weight="700">容量溢出/覆盖</text>
<line x1="300" y1="260" x2="300" y2="285" stroke="#b8862f" stroke-width="1.6"/>
<text x="300" y="305" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">D2 分层存储</text>
<line x1="390" y1="94" x2="490" y2="150" stroke="#cfcfcf"/>
<rect x="410" y="150" width="160" height="40" rx="6" fill="#ffffff" stroke="#666"/>
<text x="490" y="175" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">信息在但取不到</text>
<line x1="490" y1="190" x2="490" y2="220" stroke="#3a6ea5" stroke-width="1.6"/>
<rect x="410" y="220" width="160" height="40" rx="6" fill="#fafafa" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="490" y="245" class="l" text-anchor="middle" fill="#3a6ea5" font-weight="700">检索失败</text>
<line x1="490" y1="260" x2="490" y2="285" stroke="#3a6ea5" stroke-width="1.6"/>
<text x="490" y="305" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">改线索（非扩容）</text>
<line x1="390" y1="94" x2="680" y2="150" stroke="#cfcfcf"/>
<rect x="600" y="150" width="160" height="40" rx="6" fill="#ffffff" stroke="#666"/>
<text x="680" y="175" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">新学会旧垮掉</text>
<line x1="680" y1="190" x2="680" y2="220" stroke="#c94f4f" stroke-width="1.6"/>
<rect x="600" y="220" width="160" height="40" rx="6" fill="#fafafa" stroke="#c94f4f" stroke-width="1.6"/>
<text x="680" y="245" class="l" text-anchor="middle" fill="#c94f4f" font-weight="700">灾难性遗忘</text>
<line x1="680" y1="260" x2="680" y2="285" stroke="#c94f4f" stroke-width="1.6"/>
<text x="680" y="305" class="l" text-anchor="middle" fill="#1a1a1a" font-weight="normal">D3+D5 调度</text>
<text x="390" y="345" class="l" text-anchor="middle" fill="#666" font-weight="normal">每一条都必须先写下“失败会是什么样”再动手（附录 G.4）</text>
</svg>
